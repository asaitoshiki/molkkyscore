# Android の APK を作る。GitHub のランナーには Android SDK が入っているため、
# 手元に Android Studio がなくてもここでビルドできる。
# Actions タブの "Android APK" から実行し、成果物の apk を受け取る。
# 同じ apk をリリース「apk-latest」にも置き、決まった URL からいつでも最新版を取れるようにする。
# ストア用と同じ鍵（GitHub の Secrets）で署名するので、前の版の上から入れ直せる（記録が消えない）。
name: Android APK

on:
  workflow_dispatch:

permissions:
  # リリース「apk-latest」を作り直すため
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ランナーには Android SDK が入っているので、使用許諾と不足分だけ整える
      - name: Android SDK を整える
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36"

      - run: npm ci

      - name: Web をビルドして android へ反映
        run: npm run sync

      # 鍵はこのジョブの中だけに置き、成果物には含めない
      - name: 署名鍵を取り出す
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 が未設定です"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: APK を作る
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: molkkyscore-debug-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 決まった名前で置き直す。URL はいつも
      # https://github.com/<owner>/<repo>/releases/download/apk-latest/molkkyscore-debug.apk
      - name: リリース「apk-latest」に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk molkkyscore-debug.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest molkkyscore-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "最新の APK（動作確認用）" \
            --notes "main の $(git rev-parse --short HEAD) から作った動作確認用の APK です。"
