# Android の APK を作る。GitHub のランナーには Android SDK が入っているため、
# 手元に Android Studio がなくてもここでビルドできる。
# Actions タブの "Android APK" から実行し、成果物の apk を受け取る。
# 同じ apk をリリース「apk-latest」にも置き、決まった URL からいつでも最新版を取れるようにする。
name: Android APK

on:
  workflow_dispatch:

permissions:
  # リリース「apk-latest」を作り直すため
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ランナーには Android SDK が入っているので、使用許諾と不足分だけ整える
      - name: Android SDK を整える
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36"

      - run: npm ci

      - name: Web をビルドして android へ反映
        run: npm run sync

      - name: APK を作る
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: molkkyscore-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 決まった名前で置き直す。URL はいつも
      # https://github.com/<owner>/<repo>/releases/download/apk-latest/molkkyscore-debug.apk
      - name: リリース「apk-latest」に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk molkkyscore-debug.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest molkkyscore-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "最新の APK（動作確認用）" \
            --notes "main の $(git rev-parse --short HEAD) から作った動作確認用の APK です。"
